name: "fastapi-clean-architecture-ddd-template"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastapi-clean-architecture-ddd-template-api
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy
    expose:
      - "${APPLICATION_PORT}"
    networks:
      - fastapi-clean-architecture-ddd-template-network
    ports:
      - "${APPLICATION_PORT}:3000"
    restart: unless-stopped
    volumes:
      - ./:/app

  cache:
    image: "redis:8.6-alpine"
    container_name: fastapi-clean-architecture-ddd-template-cache
    command: >
      redis-server
      --requirepass "${REDIS_PASSWORD}"
      --appendonly yes
      --appendfsync everysec
      --maxmemory ${REDIS_MAX_MEMORY}
      --maxmemory-policy ${REDIS_MAX_MEMORY_POLICY}
      --databases ${REDIS_DATABASES}
    environment:
      - "REDIS_PASSWORD=${REDIS_PASSWORD}"
    expose:
      - "${REDIS_PORT}"
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG" ]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s
    networks:
      - fastapi-clean-architecture-ddd-template-network
    ports:
      - "${REDIS_PORT}:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data

  cache-admin:
    image: "redis/redisinsight:3.4.2"
    container_name: fastapi-clean-architecture-ddd-template-cache-admin
    depends_on:
      cache:
        condition: service_healthy
    environment:
      - "RI_REDIS_HOST=cache"
      - "RI_REDIS_PORT=6379"
      - "RI_REDIS_USERNAME=${REDIS_USERNAME}"
      - "RI_REDIS_PASSWORD=${REDIS_PASSWORD}"
      - "RI_REDIS_ALIAS=${REDISINSIGHT_REDIS_ALIAS}"
    expose:
      - "${REDISINSIGHT_PORT}"
    networks:
      - fastapi-clean-architecture-ddd-template-network
    ports:
      - "${REDISINSIGHT_PORT}:5540"
    restart: unless-stopped
    volumes:
      - redisinsight_data:/data

  database:
    container_name: fastapi-clean-architecture-ddd-template-database
    environment:
      - "POSTGRES_DB=${POSTGRESQL_DATABASE}"
      - "POSTGRES_USER=${POSTGRESQL_USERNAME}"
      - "POSTGRES_PASSWORD=${POSTGRESQL_PASSWORD}"
    expose:
      - "${POSTGRESQL_PORT}"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d \"$${POSTGRES_DB}\" -U \"$${POSTGRES_USER}\"" ]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s
    image: "postgres:17-alpine"
    networks:
      - fastapi-clean-architecture-ddd-template-network
    ports:
      - "${POSTGRESQL_PORT}:5432"
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data/

  database-admin:
    image: "dpage/pgadmin4:9.2"
    container_name: fastapi-clean-architecture-ddd-template-database-admin
    depends_on:
      database:
        condition: service_healthy
    environment:
      - "PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL}"
      - "PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD}"
    expose:
      - "${PGADMIN_PORT}"
    networks:
      - fastapi-clean-architecture-ddd-template-network
    ports:
      - "${PGADMIN_PORT}:80"
    restart: unless-stopped
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  pgadmin_data:
  redis_data:
  redisinsight_data:

networks:
  fastapi-clean-architecture-ddd-template-network:
    name: fastapi-clean-architecture-ddd-template-network
