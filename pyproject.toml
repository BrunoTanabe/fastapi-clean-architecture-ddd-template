[project]
name = "fastapi-clean-architecture-ddd-template"
version = "1.0.0"
description = "Python FastAPI backend template, organized by Clean Architecture layers (domain, application, infrastructure, presentation) and DDD principles. Includes dependency management, Docker support, testing boilerplate, CI-friendly setup and best practices, modular scaffolding to jump-start new projects and ensure long-term maintainability."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "cryptography>=46.0.5",
    "fastapi[standard]>=0.135.1",
    "hypercorn>=0.18.0",
    "jwcrypto>=1.5.6",
    "loguru>=0.7.3",
    "orjson>=3.11.7",
    "psycopg>=3.3.3",
    "psycopg-binary>=3.3.3",
    "psycopg2-binary>=2.9.11",
    "pwdlib[argon2]>=0.3.0",
    "py-automapper>=2.2.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "redis>=7.4.0",
    "sqlalchemy>=2.0.48",
    "stackprinter>=0.2.12",
]

[dependency-groups]
dev = [
    "ngrok>=1.7.0",
    "ruff>=0.15.4",
]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
# Ruff's default rule set, minus two rules that fight deliberate conventions.
ignore = [
    # BLE001 (blind-except) flags `except Exception as e:`, which is the backbone of
    # this project's three error-handling shapes. Every occurrence logs with
    # logger.opt(exception=e).error(...) and re-raises a typed StandardException, so
    # nothing is ever silently swallowed. See .claude/architecture.md.
    "BLE001",
]

[tool.ruff.lint.per-file-ignores]
# UP037 (quoted-annotation) strips the quotes from `Mapped["OtherModel"]` in
# relationships whose target is imported only under `if TYPE_CHECKING:`. SQLAlchemy
# documents the quoted form for exactly that case, and .claude/reference/persistence.md
# mandates it, so keep the quotes here.
"app/modules/*/infrastructure/models.py" = ["UP037"]

[tool.ruff.lint.flake8-bugbear]
# B008 (function-call-in-default-argument) flags FastAPI's dependency-injection
# idiom. These callables are evaluated per request by FastAPI, not once at import,
# so the mutable-default hazard the rule guards against does not apply.
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Cookie",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
    "fastapi.Security",
]
