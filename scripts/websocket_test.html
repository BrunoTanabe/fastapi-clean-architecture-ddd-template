<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebSocket Test — FastAPI Clean Architecture and DDD Template</title>
  <style>
    /* ── Reset & Base ─────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #0d1117;
      --surface:      #161b22;
      --surface-2:    #21262d;
      --border:       #30363d;
      --border-hover: #484f58;
      --text:         #e6edf3;
      --text-muted:   #8b949e;
      --text-dim:     #6e7681;
      --accent:       #388bfd;
      --accent-dim:   #1f4b8e;
      --green:        #3fb950;
      --green-bg:     #0d2b13;
      --yellow:       #d29922;
      --yellow-bg:    #2b2005;
      --red:          #f85149;
      --red-bg:       #2d0f0f;
      --purple:       #bc8cff;
      --radius:       8px;
      --radius-sm:    5px;
      --font:         'SF Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
      --font-ui:      -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-ui);
      font-size: 14px;
      line-height: 1.5;
    }

    /* ── Layout ───────────────────────────────────────────────────── */
    .app {
      display: grid;
      grid-template-rows: auto 1fr;
      height: 100vh;
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 16px;
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 0 12px;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, var(--accent), var(--purple));
      border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; font-weight: 700; color: #fff;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 16px; font-weight: 600;
      color: var(--text);
      flex: 1;
    }

    header h1 span { color: var(--text-muted); font-weight: 400; }

    .main {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 16px;
      padding: 16px 0;
      min-height: 0;
    }

    /* ── Sidebar ──────────────────────────────────────────────────── */
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 0;
      overflow-y: auto;
    }

    /* ── Cards ────────────────────────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .5px;
      color: var(--text-muted);
    }

    .card-header .icon { font-size: 14px; }

    .card-body { padding: 14px; }

    /* ── Form elements ────────────────────────────────────────────── */
    .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; }
    .field:last-child { margin-bottom: 0; }
    .field label { font-size: 12px; color: var(--text-muted); font-weight: 500; }

    input[type="text"],
    input[type="password"],
    input[type="url"] {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-family: var(--font);
      font-size: 13px;
      padding: 7px 10px;
      outline: none;
      transition: border-color .15s;
      width: 100%;
    }
    input:focus { border-color: var(--accent); }
    input::placeholder { color: var(--text-dim); }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 7px 14px;
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      font-size: 13px; font-weight: 500;
      cursor: pointer;
      transition: opacity .15s, background .15s, border-color .15s;
      font-family: var(--font-ui);
    }
    .btn:disabled { opacity: .4; cursor: not-allowed; }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      width: 100%;
    }
    .btn-primary:not(:disabled):hover { background: #58a6ff; }

    .btn-danger {
      background: transparent;
      border-color: var(--red);
      color: var(--red);
      width: 100%;
    }
    .btn-danger:not(:disabled):hover { background: var(--red-bg); }

    .btn-secondary {
      background: var(--surface-2);
      border-color: var(--border);
      color: var(--text);
    }
    .btn-secondary:not(:disabled):hover { border-color: var(--border-hover); }

    .btn-sm { padding: 4px 10px; font-size: 12px; }

    /* ── Status badge ─────────────────────────────────────────────── */
    .status-row {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 14px;
      background: var(--bg);
      border-top: 1px solid var(--border);
    }

    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot-green  { background: var(--green);  box-shadow: 0 0 6px var(--green); }
    .dot-red    { background: var(--red);    box-shadow: 0 0 6px var(--red); }
    .dot-yellow { background: var(--yellow); box-shadow: 0 0 6px var(--yellow); }
    .dot-gray   { background: var(--text-dim); }

    .status-text { font-size: 12px; color: var(--text-muted); flex: 1; }
    .status-text strong { color: var(--text); }

    /* ── Stats row ────────────────────────────────────────────────── */
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      background: var(--border);
      border-top: 1px solid var(--border);
    }
    .stat {
      background: var(--surface);
      padding: 10px 14px;
      text-align: center;
    }
    .stat-val {
      font-family: var(--font);
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
    }
    .stat-val.green  { color: var(--green); }
    .stat-val.yellow { color: var(--yellow); }
    .stat-val.red    { color: var(--red); }
    .stat-label { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: .4px; margin-top: 2px; }

    /* ── Content area ─────────────────────────────────────────────── */
    .content {
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 0;
    }

    .content .card { flex: 1; display: flex; flex-direction: column; min-height: 0; }

    /* ── Log ──────────────────────────────────────────────────────── */
    .log-toolbar {
      display: flex; align-items: center; gap: 6px;
      margin-left: auto;
    }

    #log {
      flex: 1;
      overflow-y: auto;
      padding: 12px 14px;
      font-family: var(--font);
      font-size: 12px;
      line-height: 1.7;
    }

    .log-empty {
      display: flex; align-items: center; justify-content: center;
      height: 100%;
      color: var(--text-dim);
      font-family: var(--font-ui);
      font-size: 13px;
    }

    .log-entry {
      display: grid;
      grid-template-columns: 80px 60px 1fr;
      gap: 10px;
      padding: 5px 0;
      border-bottom: 1px solid #1c2128;
      animation: fadeIn .15s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; } }

    .log-time { color: var(--text-dim); user-select: none; }

    .log-tag {
      font-size: 10px;
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 3px;
      text-transform: uppercase;
      letter-spacing: .4px;
      white-space: nowrap;
      align-self: start;
    }
    .tag-info     { background: var(--accent-dim);  color: var(--accent); }
    .tag-recv     { background: var(--green-bg);    color: var(--green); }
    .tag-warn     { background: var(--yellow-bg);   color: var(--yellow); }
    .tag-error    { background: var(--red-bg);      color: var(--red); }
    .tag-system   { background: #1c1c2e; color: var(--purple); }

    .log-msg { color: var(--text); word-break: break-all; }
    .log-msg pre {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 8px 10px;
      margin-top: 5px;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 11.5px;
      color: var(--text-muted);
    }

    /* ── Notifications panel ──────────────────────────────────────── */
    .notif-list {
      padding: 6px 0;
      max-height: 220px;
      overflow-y: auto;
    }

    .notif-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      transition: background .1s;
      cursor: default;
    }
    .notif-item:last-child { border-bottom: none; }
    .notif-item:hover { background: var(--surface-2); }
    .notif-item.is-unread .notif-title { color: var(--text); font-weight: 600; }
    .notif-item.is-read   .notif-title { color: var(--text-muted); font-weight: 400; }

    .notif-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      margin-top: 5px;
      flex-shrink: 0;
    }
    .notif-dot.unread { background: var(--accent); }
    .notif-dot.read   { background: var(--text-dim); }

    .notif-body { flex: 1; min-width: 0; }
    .notif-title { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .notif-meta  { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
    .notif-type  {
      font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .3px;
      color: var(--purple);
      white-space: nowrap;
    }

    .notif-actions { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }

    .notif-empty {
      padding: 20px;
      text-align: center;
      color: var(--text-dim);
      font-size: 12px;
    }

    /* ── Scrollbar ────────────────────────────────────────────────── */
    ::-webkit-scrollbar       { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--border-hover); }

    /* ── Misc ─────────────────────────────────────────────────────── */
    .divider { height: 1px; background: var(--border); margin: 4px 0; }

    .toast-area {
      position: fixed;
      bottom: 20px; right: 20px;
      display: flex; flex-direction: column; gap: 8px;
      z-index: 999;
      pointer-events: none;
    }
    .toast {
      padding: 10px 16px;
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 500;
      max-width: 320px;
      animation: slideIn .2s ease, fadeOut .3s ease 2.7s forwards;
      pointer-events: none;
    }
    .toast-info  { background: var(--accent-dim); color: var(--accent); border: 1px solid var(--accent); }
    .toast-recv  { background: var(--green-bg);   color: var(--green);  border: 1px solid var(--green); }
    .toast-error { background: var(--red-bg);     color: var(--red);    border: 1px solid var(--red); }

    @keyframes slideIn   { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @keyframes fadeOut   { from { opacity: 1; } to { opacity: 0; } }

    .badge {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 18px; height: 18px;
      padding: 0 5px;
      background: var(--red);
      color: #fff;
      border-radius: 9px;
      font-size: 10px;
      font-weight: 700;
    }
    .badge:empty { display: none; }
  </style>
</head>
<body>

<div class="app">
  <!-- Header -->
  <header>
    <div class="logo">W</div>
    <h1>WebSocket Test <span>— FastAPI Clean Architecture and DDD Template</span></h1>
    <span id="unreadBadge" class="badge"></span>
  </header>

  <div class="main">

    <!-- ── Sidebar ─────────────────────────────────────── -->
    <div class="sidebar">

      <!-- Connection config -->
      <div class="card">
        <div class="card-header"><span class="icon">⚙</span> Configuration</div>
        <div class="card-body">
          <div class="field">
            <label>Base URL</label>
            <input id="baseUrl" type="url" value="http://localhost:8000" />
          </div>
          <div class="field">
            <label>E-mail</label>
            <input id="email" type="text" placeholder="user@example.com" />
          </div>
          <div class="field">
            <label>Password</label>
            <input id="password" type="password" placeholder="••••••••" />
          </div>
        </div>

        <!-- Actions -->
        <div class="card-body" style="padding-top:0; display:flex; flex-direction:column; gap:8px;">
          <button class="btn btn-primary" id="btnLogin" onclick="login()">
            🔑 Login & Connect
          </button>
          <button class="btn btn-danger" id="btnDisconnect" onclick="disconnect()" disabled>
            ✕ Disconnect
          </button>
        </div>

        <!-- Status -->
        <div class="status-row">
          <div class="dot dot-gray" id="statusDot"></div>
          <span class="status-text" id="statusText">Not connected</span>
        </div>

        <!-- Stats -->
        <div class="stats">
          <div class="stat">
            <div class="stat-val green" id="statReceived">0</div>
            <div class="stat-label">Received</div>
          </div>
          <div class="stat">
            <div class="stat-val yellow" id="statUnread">0</div>
            <div class="stat-label">Unread</div>
          </div>
          <div class="stat">
            <div class="stat-val red" id="statErrors">0</div>
            <div class="stat-label">Errors</div>
          </div>
        </div>
      </div>

      <!-- Notifications -->
      <div class="card" style="flex:1; display:flex; flex-direction:column; min-height:0;">
        <div class="card-header">
          <span class="icon">🔔</span> Notifications
          <span style="margin-left:auto; display:flex; gap:6px;">
            <button class="btn btn-secondary btn-sm" onclick="fetchNotifications()" title="Refresh">↻</button>
          </span>
        </div>
        <div class="notif-list" id="notifList">
          <div class="notif-empty">Login to load notifications.</div>
        </div>
      </div>

    </div>

    <!-- ── Content ─────────────────────────────────────── -->
    <div class="content">
      <div class="card">
        <div class="card-header">
          <span class="icon">📡</span> Event Log
          <div class="log-toolbar">
            <button class="btn btn-secondary btn-sm" onclick="clearLog()">Clear</button>
          </div>
        </div>
        <div id="log">
          <div class="log-empty" id="logEmpty">Waiting for events…</div>
        </div>
      </div>
    </div>

  </div><!-- .main -->
</div><!-- .app -->

<div class="toast-area" id="toastArea"></div>

<script>
  /* ── State ───────────────────────────────────────────────────── */
  let ws           = null;
  let statReceived = 0;
  let statErrors   = 0;

  /* ── Helpers ─────────────────────────────────────────────────── */
  const $ = id => document.getElementById(id);

  function baseUrl()  { return $('baseUrl').value.replace(/\/$/, ''); }
  function wsUrl()    { return baseUrl().replace(/^http/, 'ws') + '/api/v1/websocket/connect'; }
  function httpBase() { return baseUrl(); }

  function timestamp() {
    const d = new Date();
    return d.toTimeString().slice(0, 8) + '.' + String(d.getMilliseconds()).padStart(3, '0');
  }

  /* ── Log ─────────────────────────────────────────────────────── */
  function log(type, message, detail) {
    const empty = $('logEmpty');
    if (empty) empty.remove();

    const entry = document.createElement('div');
    entry.className = 'log-entry';

    const tagClass = { info: 'tag-info', recv: 'tag-recv', warn: 'tag-warn', error: 'tag-error', system: 'tag-system' }[type] || 'tag-info';

    entry.innerHTML = `
      <span class="log-time">${timestamp()}</span>
      <span class="log-tag ${tagClass}">${type}</span>
      <span class="log-msg">${escHtml(message)}${detail ? `<pre>${escHtml(JSON.stringify(detail, null, 2))}</pre>` : ''}</span>
    `;

    const logEl = $('log');
    logEl.appendChild(entry);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function clearLog() {
    $('log').innerHTML = '<div class="log-empty" id="logEmpty">Waiting for events…</div>';
  }

  function escHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  /* ── Toast ───────────────────────────────────────────────────── */
  function toast(type, msg) {
    const el = document.createElement('div');
    el.className = `toast toast-${type}`;
    el.textContent = msg;
    $('toastArea').appendChild(el);
    setTimeout(() => el.remove(), 3100);
  }

  /* ── Status ──────────────────────────────────────────────────── */
  function setStatus(dot, text) {
    const dotEl = $('statusDot');
    dotEl.className = 'dot dot-' + dot;
    $('statusText').innerHTML = text;
  }

  function updateStats(received, unread, errors) {
    if (received !== undefined) { statReceived = received; $('statReceived').textContent = received; }
    if (unread   !== undefined) { $('statUnread').textContent = unread; $('unreadBadge').textContent = unread > 0 ? unread : ''; }
    if (errors   !== undefined) { statErrors = errors; $('statErrors').textContent = errors; }
  }

  /* ── Login ───────────────────────────────────────────────────── */
  async function login() {
    const email = $('email').value.trim();
    const pass  = $('password').value;

    if (!email || !pass) { toast('error', 'E-mail and password are required.'); return; }

    setStatus('yellow', '<strong>Logging in…</strong>');
    log('info', `POST ${httpBase()}/api/v1/authentication/login`);

    try {
      const body = new URLSearchParams({ username: email, password: pass, grant_type: 'password' });
      const res = await fetch(`${httpBase()}/api/v1/authentication/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        credentials: 'include',
        body,
      });

      const data = await res.json().catch(() => ({}));

      if (!res.ok) {
        const msg = data?.detail?.details?.message || data?.detail || `HTTP ${res.status}`;
        log('error', `Login failed — ${msg}`, data);
        toast('error', `Login failed: ${msg}`);
        setStatus('red', `<strong>Login failed</strong> (${res.status})`);
        updateStats(undefined, undefined, ++statErrors);
        return;
      }

      log('info', 'Login successful — cookies set by server.', data);
      toast('info', '✓ Logged in');
      setStatus('yellow', '<strong>Connecting WebSocket…</strong>');

      await fetchNotifications();
      connect();

    } catch (err) {
      log('error', `Login error: ${err.message}`);
      toast('error', `Network error: ${err.message}`);
      setStatus('red', '<strong>Login error</strong>');
      updateStats(undefined, undefined, ++statErrors);
    }
  }

  /* ── WebSocket ───────────────────────────────────────────────── */
  function connect() {
    if (ws) { ws.close(); ws = null; }

    const url = wsUrl();
    log('system', `Connecting → ${url}`);

    try {
      ws = new WebSocket(url);
    } catch (err) {
      log('error', `WebSocket constructor error: ${err.message}`);
      setStatus('red', '<strong>Connection failed</strong>');
      updateStats(undefined, undefined, ++statErrors);
      return;
    }

    ws.onopen = () => {
      log('system', 'WebSocket connected ✓');
      toast('info', '✓ WebSocket connected');
      setStatus('green', '<strong>Connected</strong>');
      $('btnDisconnect').disabled = false;
      $('btnLogin').disabled = true;
      updateStats(statReceived, undefined, statErrors);
    };

    ws.onmessage = (evt) => {
      updateStats(++statReceived, undefined, statErrors);
      let parsed;
      try   { parsed = JSON.parse(evt.data); }
      catch { log('warn', 'Non-JSON message received.', { raw: evt.data }); return; }

      const type = parsed?.message_type ?? 'unknown';
      log('recv', `Message received — type: <strong>${escHtml(type)}</strong>`, parsed);
      toast('recv', `📨 ${type}`);

      // If it's a notification, refresh the list
      if (type === 'notification') {
        fetchNotifications();
      }
    };

    ws.onerror = (evt) => {
      log('error', 'WebSocket error — check the console for details.');
      toast('error', 'WebSocket error');
      updateStats(undefined, undefined, ++statErrors);
    };

    ws.onclose = (evt) => {
      const reason = evt.reason ? ` — "${evt.reason}"` : '';
      log('warn', `WebSocket closed (code ${evt.code})${reason}`);
      toast('error', `WebSocket closed (${evt.code})`);
      setStatus('red', `<strong>Disconnected</strong> (code ${evt.code})`);
      $('btnDisconnect').disabled = true;
      $('btnLogin').disabled = false;
      ws = null;
    };
  }

  function disconnect() {
    if (ws) {
      log('system', 'Closing connection…');
      ws.close(1000, 'User closed');
    }
  }

  /* ── Notifications ───────────────────────────────────────────── */
  async function fetchNotifications() {
    try {
      const res = await fetch(`${httpBase()}/api/v1/notification?page=1&limit=20`, {
        credentials: 'include',
      });

      if (res.status === 401) { log('warn', 'GET /notification — 401 Unauthorized (not logged in yet).'); return; }
      if (!res.ok)            { log('warn', `GET /notification — HTTP ${res.status}`); return; }

      const data = await res.json();
      const list = data?.details?.data?.Notification ?? data?.details?.data?.notifications ?? [];
      const pagination = data?.details?.data?.pagination ?? {};
      const total      = pagination.total ?? list.length;
      const unread     = list.filter(n => !n.is_read).length;

      log('info', `Fetched ${list.length} notification(s) — ${unread} unread.`);
      updateStats(undefined, unread, undefined);
      renderNotifications(list, total);

    } catch (err) {
      log('error', `fetchNotifications error: ${err.message}`);
    }
  }

  function renderNotifications(list, total) {
    const el = $('notifList');

    if (!list.length) {
      el.innerHTML = '<div class="notif-empty">No notifications found.</div>';
      return;
    }

    el.innerHTML = list.map(n => {
      const date = n.created_at
        ? new Date(n.created_at).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' })
        : '';
      const isRead = n.is_read;

      return `
        <div class="notif-item ${isRead ? 'is-read' : 'is-unread'}" id="notif-${n.id}">
          <div class="notif-dot ${isRead ? 'read' : 'unread'}"></div>
          <div class="notif-body">
            <div class="notif-title" title="${escHtml(n.title ?? '')}">${escHtml(n.title ?? '(no title)')}</div>
            <div class="notif-meta">
              <span class="notif-type">${escHtml(n.notification_type ?? '')}</span>
              ${date ? ` · ${escHtml(date)}` : ''}
            </div>
          </div>
          <div class="notif-actions">
            ${!isRead
              ? `<button class="btn btn-secondary btn-sm" onclick="markAsRead('${n.id}')" title="Mark as read">✓</button>`
              : ''}
          </div>
        </div>
      `;
    }).join('');
  }

  async function markAsRead(id) {
    log('info', `PATCH /api/v1/notification/${id}`);
    try {
      const res = await fetch(`${httpBase()}/api/v1/notification/${id}`, {
        method: 'PATCH',
        credentials: 'include',
      });
      const data = await res.json().catch(() => ({}));

      if (!res.ok) {
        log('error', `Mark as read failed — HTTP ${res.status}`, data);
        toast('error', `Failed (${res.status})`);
        return;
      }

      log('info', `Notification ${id} marked as read.`);
      toast('info', '✓ Marked as read');
      await fetchNotifications();

    } catch (err) {
      log('error', `markAsRead error: ${err.message}`);
    }
  }

  /* ── Init ────────────────────────────────────────────────────── */
  log('system', 'Test page ready. Fill in the credentials and click Login & Connect.');
</script>
</body>
</html>
